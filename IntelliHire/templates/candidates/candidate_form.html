{% extends "base.html" %}
{% block page_title %}{% if object %}Edit{% else %}Add{% endif %} Candidate{% endblock %}
{% block content %}
<div class="card ih-card p-4">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
    {% for field in form %}
      <div class="col-md-4 mb-3">
        <label class="form-label small">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary">Save Candidate</button>
    <a href="{% url 'candidates:list' %}" class="btn btn-light">Cancel</a>
  </form>
</div>
{% endblock %}
