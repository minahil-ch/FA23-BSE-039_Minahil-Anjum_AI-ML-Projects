{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block auth_content %}
<div class="d-flex align-items-center justify-content-center py-5" style="min-height:100vh; background:linear-gradient(135deg,#4f46e5,#1e1b3a);">
  <div class="card ih-card p-4 shadow" style="width: 500px;">
    <div class="text-center mb-3">
      <i class="fa-solid fa-user-plus fa-2x text-primary"></i>
      <h4 class="mt-2 mb-0">Create HR Account</h4>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="row">
      {% for field in form %}
        <div class="col-6 mb-3">
          <label class="form-label small">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <p class="text-center mt-3 mb-0 small">Already have an account? <a href="{% url 'accounts:login' %}">Login</a></p>
  </div>
</div>
{% endblock %}
