{% extends 'base.html' %}
{% block title %}Sign In — AI Dataset Cleaning{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card fade-in">
        <div class="card-body">
            <!-- Logo -->
            <div class="text-center mb-4">
                <div class="auth-logo-icon">
                    <i class="bi bi-database-gear"></i>
                </div>
                <h2 class="fw-bold mb-1" style="font-size:1.5rem;">Welcome Back</h2>
                <p style="color:var(--text-muted);font-size:0.875rem;margin:0;">Sign in to your AI workspace</p>
            </div>

            {% if form.non_field_errors %}
            <div class="alert alert-danger mb-3">
                <i class="bi bi-exclamation-circle-fill me-2"></i>{{ form.non_field_errors.0 }}
            </div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" id="id_username"
                               class="form-control form-control-lg"
                               style="border-left:none;"
                               required autofocus placeholder="Enter your username">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" id="id_password"
                               class="form-control form-control-lg"
                               style="border-left:none;border-right:none;"
                               required placeholder="Enter your password">
                        <button type="button" class="input-group-text"
                                style="cursor:pointer;background:var(--bg-secondary);border-left:none;"
                                onclick="togglePwd()" aria-label="Show/hide password">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right"></i>Sign In
                </button>
            </form>

            <div style="text-align:center;font-size:0.875rem;color:var(--text-muted);">
                Don't have an account?
                <a href="{% url 'accounts:signup' %}" style="color:var(--accent-1);font-weight:600;">Create one</a>
            </div>
        </div>
    </div>
</div>

<script>
function togglePwd() {
    const input = document.getElementById('id_password');
    const icon  = document.getElementById('eyeIcon');
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.className = input.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}
</script>
{% endblock %}
